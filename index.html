<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Переплёт" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Переплёт — совместная книга. Главы появляются по одной." />
    <meta property="og:title" content="Переплёт" />
    <meta property="og:description" content="История, которую мы пишем вместе." />
    <meta property="og:type" content="book" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="/og.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Переплёт</title>
    <script>
      ;(function () {
        var theme = 'system'
        var fontScale = '1'
        var lineHeight = '1.7'
        try {
          var raw = localStorage.getItem('pereplet.settings')
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed.theme) theme = parsed.theme
            if (typeof parsed.fontScale === 'number') fontScale = String(parsed.fontScale)
            if (typeof parsed.lineHeight === 'number') lineHeight = String(parsed.lineHeight)
          }
        } catch (error) {
          /* storage может быть недоступен */
        }
        var resolved = theme
        if (theme === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper'
        }
        if (resolved !== 'paper' && resolved !== 'sepia' && resolved !== 'dark') resolved = 'paper'
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.setProperty('--font-scale', fontScale)
        document.documentElement.style.setProperty('--line-height', lineHeight)
        var colors = { paper: '#f4efe6', sepia: '#f3e4cc', dark: '#141210' }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[resolved])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
